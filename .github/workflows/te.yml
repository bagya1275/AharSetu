name: AharSetu Complete Testing

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:

  # ==============================
  # FLUTTER TESTS
  # ==============================

  flutter-tests:
    name: Flutter Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Find Flutter Project
        id: flutter
        run: |
          FILE=$(find . -name pubspec.yaml -not -path './.git/*' | head -1)

          if [ -z "$FILE" ]; then
            echo "No pubspec.yaml found"
            exit 1
          fi

          DIR=$(dirname "$FILE")
          echo "Flutter project found at: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Install Flutter Dependencies
        working-directory: ${{ steps.flutter.outputs.dir }}
        run: flutter pub get

      - name: Run Flutter Tests
        working-directory: ${{ steps.flutter.outputs.dir }}
        run: flutter test


  # ==============================
  # INTEGRATION TESTS
  # ==============================

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Find Flutter Project
        id: flutter
        run: |
          FILE=$(find . -name pubspec.yaml -not -path './.git/*' | head -1)

          if [ -z "$FILE" ]; then
            echo "No pubspec.yaml found"
            exit 1
          fi

          DIR=$(dirname "$FILE")
          echo "Flutter project found at: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Install Dependencies
        working-directory: ${{ steps.flutter.outputs.dir }}
        run: flutter pub get

      - name: Run Integration Tests
        working-directory: ${{ steps.flutter.outputs.dir }}
        run: |
          if [ -d integration_test ]; then
            flutter test integration_test
          else
            echo "No integration_test folder found"
            echo "Integration tests: SKIPPED"
          fi


  # ==============================
  # SELENIUM TESTS
  # ==============================

  selenium-tests:
    name: Selenium Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Find Node Project
        id: node
        run: |
          FILE=$(find . -name package.json -not -path './node_modules/*' -not -path './.git/*' | head -1)

          if [ -z "$FILE" ]; then
            echo "No package.json found"
            echo "dir=" >> "$GITHUB_OUTPUT"
          else
            DIR=$(dirname "$FILE")
            echo "Node project found at: $DIR"
            echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Node Dependencies
        if: steps.node.outputs.dir != ''
        working-directory: ${{ steps.node.outputs.dir }}
        run: npm install

      - name: Run Selenium Tests
        if: steps.node.outputs.dir != ''
        working-directory: ${{ steps.node.outputs.dir }}
        run: |
          if npm run | grep -q "test:selenium"; then
            npm run test:selenium
          elif npm run | grep -q "selenium"; then
            npm run selenium
          elif npm test -- --help >/dev/null 2>&1; then
            npm test
          else
            echo "No Selenium npm script found."
            echo "Please add the Selenium test command to package.json."
            exit 1
          fi

      - name: Selenium Test Summary
        if: success()
        run: |
          echo "===================================="
          echo "SELENIUM TESTS PASSED"
          echo "===================================="


  # ==============================
  # VULNERABILITY TEST
  # ==============================

  vulnerability-scan:
    name: Vulnerability Security Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Find package.json
        id: node
        run: |
          FILE=$(find . -name package.json -not -path './node_modules/*' -not -path './.git/*' | head -1)

          if [ -z "$FILE" ]; then
            echo "No package.json found"
            echo "dir=" >> "$GITHUB_OUTPUT"
          else
            DIR=$(dirname "$FILE")
            echo "Node project found at: $DIR"
            echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Dependencies
        if: steps.node.outputs.dir != ''
        working-directory: ${{ steps.node.outputs.dir }}
        run: npm install

      - name: Security Audit
        if: steps.node.outputs.dir != ''
        working-directory: ${{ steps.node.outputs.dir }}
        run: npm audit --audit-level=high

      - name: Security Test Passed
        run: |
          echo "===================================="
          echo "VULNERABILITY SCAN PASSED"
          echo "===================================="


  # ==============================
  # FINAL STATUS
  # ==============================

  all-tests-passed:
    name: All Tests Passed
    if: ${{ always() }}
    needs:
      - flutter-tests
      - integration-tests
      - selenium-tests
      - vulnerability-scan
    runs-on: ubuntu-latest

    steps:
      - name: Show Final Status
        run: |
          echo "=========================================="
          echo "        AHARSETU TEST RESULTS"
          echo "=========================================="
          echo "Flutter Tests       : ${{ needs.flutter-tests.result }}"
          echo "Integration Tests   : ${{ needs.integration-tests.result }}"
          echo "Selenium Tests      : ${{ needs.selenium-tests.result }}"
          echo "Security Tests      : ${{ needs.vulnerability-scan.result }}"
          echo "=========================================="

          if [ "${{ needs.flutter-tests.result }}" = "success" ] && \
             [ "${{ needs.integration-tests.result }}" = "success" ] && \
             [ "${{ needs.selenium-tests.result }}" = "success" ] && \
             [ "${{ needs.vulnerability-scan.result }}" = "success" ]; then
            echo "ALL TESTS PASSED"
          else
            echo "SOME TESTS FAILED"
            exit 1
          fi
