name: AharSetu Complete Test Suite

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:

  # =========================================================
  # 1. FLUTTER AUTOMATED TESTS
  # =========================================================
  flutter-tests:
    name: Flutter Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Flutter Tests
        run: flutter test

  # =========================================================
  # 2. API / FUNCTIONAL TESTS
  # =========================================================
  api-tests:
    name: API / Functional Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          if [ -f package.json ]; then
            npm install
          fi

      - name: Run API Tests
        run: |
          if [ -f package.json ]; then
            npm test
          else
            echo "No package.json found"
          fi

  # =========================================================
  # 3. SECURITY / VULNERABILITY TESTS
  # =========================================================
  security-tests:
    name: Vulnerability / Security Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          if [ -f package.json ]; then
            npm install
          fi

      - name: NPM Vulnerability Audit
        run: |
          if [ -f package.json ]; then
            npm audit --audit-level=high
          else
            echo "No package.json found"
          fi

      - name: Security Test Files
        run: |
          if [ -d security-tests ]; then
            echo "Security test directory found"
            find security-tests -type f
          else
            echo "No security-tests directory found"
          fi

  # =========================================================
  # 4. SELENIUM TESTS
  # =========================================================
  selenium-tests:
    name: Selenium Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          if [ -f package.json ]; then
            npm install
          fi

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Start Application
        run: |
          if [ -f package.json ]; then
            npm run dev > app.log 2>&1 &
            sleep 10
          fi

      - name: Run Selenium Tests
        run: |
          if [ -d selenium-tests ]; then
            npm run test:selenium
          elif [ -d tests/selenium ]; then
            npm run test:selenium
          else
            echo "Selenium test directory not found"
          fi

      - name: Upload Selenium Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Selenium-Test-Report
          path: |
            reports/
            test-results/
            selenium-report/
          if-no-files-found: ignore

  # =========================================================
  # 5. END-TO-END TESTS
  # =========================================================
  e2e-tests:
    name: End-to-End Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          if [ -f package.json ]; then
            npm install
          fi

      - name: Run E2E Tests
        run: |
          if [ -d e2e ]; then
            npm run test:e2e
          elif [ -d tests/e2e ]; then
            npm run test:e2e
          else
            echo "E2E test directory not found"
          fi

  # =========================================================
  # 6. FINAL TEST STATUS
  # =========================================================
  all-tests-passed:
    name: All Tests Passed
    runs-on: ubuntu-latest

    needs:
      - flutter-tests
      - api-tests
      - security-tests
      - selenium-tests
      - e2e-tests

    steps:
      - name: All Tests Passed
        run: |
          echo "========================================="
          echo "       AHARSETU TEST SUITE PASSED"
          echo "========================================="
          echo "Flutter Tests       : PASSED"
          echo "API Tests            : PASSED"
          echo "Security Tests       : PASSED"
          echo "Selenium Tests       : PASSED"
          echo "E2E Tests            : PASSED"
          echo "========================================="
