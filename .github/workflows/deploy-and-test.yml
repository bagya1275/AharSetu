name: Deploy and E2E Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

env:
  BASE_URL: https://bagya1275.github.io/AharSetu/

jobs:
  build-and-deploy:
    name: Build, Deploy and Run E2E
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Clean Install
        run: |
          rm -rf node_modules
          rm -f package-lock.json
          npm install

      - name: Build Application
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages

      - name: Wait for GitHub Pages
        run: |
          echo "Waiting for deployment..."
          sleep 60

      - name: Verify Deployment
        run: |
          curl -I $BASE_URL

      - name: Setup Automation Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: automation/package.json

      - name: Install Automation Dependencies
        run: |
          cd automation
          rm -rf node_modules
          rm -f package-lock.json
          npm install

      - name: Run Selenium Tests
        env:
          BASE_URL: ${{ env.BASE_URL }}
        run: |
          cd automation
          npm run ci:e2e

      - name: Upload Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Selenium-Reports
          path: |
            automation/reports/**
            automation/screenshots/**
            automation/logs/**
            automation/results/**
          retention-days: 30

      - name: Publish Summary
        if: always()
        run: |
          echo "# Live GitHub Pages E2E Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Deployment URL: $BASE_URL" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Build Completed" >> $GITHUB_STEP_SUMMARY
          echo "✅ Deployment Completed" >> $GITHUB_STEP_SUMMARY
          echo "✅ Selenium Execution Completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Reports uploaded as GitHub Artifacts." >> $GITHUB_STEP_SUMMARY